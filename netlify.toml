[build]
  command = "npm run build"
  publish = "dist"

# Force canonical redirect from default Netlify subdomain to custom domain
[[redirects]]
  from = "https://mono-transcoder.netlify.app/*"
  to = "https://monotranscoder.runs-on.dev/:splat"
  status = 301
  force = true

